# A realistic work DAG: get a half-built project to its next usable CVP.
#
#   dagrun plan examples/next-cvp/plan.yaml
#   dagrun next --json | jq -r '.ready[0].prompt'
#   dagrun run --workers 4
#
# Every node names the artifact that proves it happened. Nothing else counts.

version: 1
run: next-usable-cvp
intent: |
  Take a partially finished CLI from "compiles and sort of works" to a state a
  second person can install, run, and trust: installable, documented, tested,
  and demoable. Stop at the next checkpoint where handing it to someone else is
  safe, not at feature completeness.

artifacts_root: artifacts
max_parallel: 4
defaults:
  estimate: 10m
  timeout: 20m
  max_attempts: 2
role_caps:
  research: 2

nodes:
  - id: "1.1"
    kind: INTENT
    role: intent
    title: Freeze the scope of this checkpoint
    artifacts:
      - path: artifacts/INTENT.md
        min_bytes: 400
        must_contain: ["Acceptance Criteria"]

  - id: "1.2"
    kind: SPEC
    role: spec
    title: Write the behavioural contract for `dagrun run`
    deps: ["1.1"]
    artifacts:
      - path: artifacts/SPEC.md
        min_bytes: 600
        must_contain: ["Requirement"]

  - id: "1.3"
    kind: RESEARCH
    role: research
    title: How do other DAG executors express node contracts
    deps: ["1.1"]
    artifacts:
      - path: artifacts/RESEARCH.md
        min_bytes: 800
        must_contain: ["## Sources"]

  - id: "1.4"
    kind: SOTA
    role: research
    title: Prior art and what it already solved
    deps: ["1.1"]
    artifacts:
      - path: artifacts/SOTA.md
        min_bytes: 600
        must_contain: ["Verdict"]

  - id: "2.1"
    kind: TEST
    role: impl
    title: Write the failing test for lease expiry
    deps: ["1.2"]
    artifacts:
      - path: "internal/store/*_test.go"
        min_count: 1
    check: "true"

  - id: "2.2"
    kind: IMPL
    role: impl
    title: Implement lease reclaim and epoch fencing
    deps: ["2.1"]
    artifacts:
      - path: internal/store/lease.go
        min_bytes: 800
    check: "true"

  - id: "2.3"
    kind: UI
    role: ui
    title: Status view a human can read at a glance
    deps: ["1.2"]
    artifacts:
      - path: artifacts/UI.md
        min_bytes: 300

  - id: "3.1"
    kind: DOC
    role: docs
    title: README a stranger can follow
    deps: ["2.2", "2.3"]
    artifacts:
      - path: README.md
        min_bytes: 800

  - id: "3.2"
    kind: GATE
    role: gate
    title: Everything builds and the suite is green
    deps: ["3.1"]
    check: "go build ./... && go test ./... >/dev/null"
